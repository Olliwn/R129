    applies_to:
      years: [1989, 1995]
    source:
      type: "factory_manual"
      ref: "Betriebsanleitung 1991-1993, p.120"
      confidence: "high"

  - id: F20_6
    rating_amps: 8
    color: "white"
    location: "Trunk fuse box F20, position 6"
    protects:
      - "Trunk light (Kofferraumleuchte)"
      - "Central locking control unit (Steuergerät Zentralverriegelung)"
      - "Automatic antenna (automatische Antenne)"
      - "Infrared remote control unit (Steuergerät Infrarot-Fernbedienung)"
    terminal: "30"
    permanent_12v: true
    notes: >
      PRIMARY parasitic draw fuse. Powers four always-on or semi-always-on
