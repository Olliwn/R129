description: >
  R129 fuse box assignments for pre-facelift models (1989-1995).
  Three fuse locations:
    1. Hauptsicherungskasten (main fuse box) — engine compartment, left side (F1), 16 fuses
    2. Zusatzsicherungsdose Motorraum (auxiliary fuse box F19) — engine compartment, behind main box near brake booster, fuses A-H + 1-3
    3. Zusatzsicherungsdose Kofferraum (trunk auxiliary fuse box F20) — trunk rear wall, 7 positions (pre-facelift torpedo fuses)
  Post-facelift (~09/1995-2002) cars have a different trunk fuse box (F4, 9 blade fuses) — listed separately below.

source_note: >
  Main fuse box and F19/F20 assignments verified from the 1991 Betriebsanleitung
  (r129-betriebsanleitung-1991-1993-DE.pdf, pages 119-120). This is the factory
  owner's manual and supersedes earlier community-sourced data in this file.
  Post-facelift F4 data from fuse designation card P/N 129 545 25 00 (15.12.99).

