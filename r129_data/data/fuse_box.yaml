  - id: F20_FUSE6
    rating_amps: 8
    color: "white"
    location: "Trunk auxiliary fuse holder F20, position 6 (bottom)"
    protects:
      - "UNVERIFIED -- likely central locking (per BenzWorld 1995 SL500 thread)"
      - "UNVERIFIED -- possibly power antenna (shared circuit per BenzWorld)"
    notes: >
      Found BLOWN on AOK912 on 2026-03-30 (original aluminum torpedo fuse).
      Confirmed 8A white from photo (2026-04-01). Diary attributed this as root
      cause of dead PSE central locking. Forum evidence supports this for some
      pre-facelift cars. Needs verification from the F20 cover or ETM.
    applies_to:
      years: [1989, 1995]
    source:
      type: "community + photo"
      ref: "BenzWorld (1995 SL500), PeachParts (1993 500SL), AOK912 photo 2026-04-01"
      confidence: "medium"
