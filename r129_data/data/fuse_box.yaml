description: >
  R129 fuse box assignments for pre-facelift models (1989-1995).
  The main fuse box is located in the engine compartment, left side (F1).
  Additional fuses: component compartment (F19), trunk (F20), CTEL (F22/2).
  NOTE: Specific fuse assignments need verification from the ETM.
  The owner's manual provides the fuse legend but circuit details require ETM data.

trunk_fuse_box_warning: >
  CAUTION: Two different trunk fuse boxes exist across R129 production.
  Pre-facelift (1989 to ~08/1995): Auxiliary Fuse Holder F20 (torpedo fuses).
  Post-facelift (~09/1995 to 2002): Fuse Box F4 (blade fuses, 9 positions).
  The fuse designation card P/N 129 545 25 00 (dated 15.12.99, ingested as
  trunk_fuses.pdf) describes the POST-FACELIFT F4 box only and does NOT apply
  to pre-facelift cars like AOK912 (1991, 129.066). The pre-facelift F20
  assignments are printed on the fuse box cover (per the 1991 Betriebsanleitung
  p.95) but no factory chart has been sourced for this repository yet.
  Forum evidence (BenzWorld) suggests pre-facelift fuse 6 = central locking,
  but this requires physical verification against the F20 cover or ETM data.

