  # === PRE-FACELIFT TRUNK AUXILIARY FUSE HOLDER (F20, 1989 to ~08/1995) ===
  # Part number: A 129 540 04 50 (confirmed from AOK912 photo, 2026-04-01)
  # Physical layout: 6 torpedo fuse positions (numbered 1 at top, 6 at bottom),
  # plus round screw-type terminals at top of the holder.
  # The 1991 Betriebsanleitung (p.95) states this box contains fuses for
  # "Schließanlage und Dachbetätigung" (locking system and roof operation).
  # Per-position assignments have NOT been verified from the factory ETM or
  # fuse box cover. Forum evidence (BenzWorld, 2013 thread on 1995 SL500)
  # suggests: Fuse 6 = Central locking (and possibly power antenna).
  # A 1993 500SL owner (PeachParts) reported 6 fuses with ratings:
  #   1=16A red, 2=16A red, 3=25A blue, 4=8A white, 5=16A red, 6=8A white.
  # AOK912 photo (2026-04-01) confirms 6 torpedo fuses and fuse 6 (bottom)
  # is 8A white, matching the PeachParts data.

  - id: F20_FUSE1
    rating_amps: 16
    color: "red"
    location: "Trunk auxiliary fuse holder F20, position 1 (top)"
    protects:
      - "UNVERIFIED"
    applies_to:
      years: [1989, 1995]
    source:
      type: "community"
      ref: "PeachParts (1993 500SL fuse ratings)"
      confidence: "low"

