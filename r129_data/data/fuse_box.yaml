  # =============================================================================
  # PRE-FACELIFT TRUNK FUSE BOX (F20, 1989 to ~08/1995) — 7 positions
  # Part number: A 129 540 04 50 (confirmed from AOK912 photo, 2026-04-01)
  # Physical layout: torpedo fuses, numbered 1-7.
  # Source: Betriebsanleitung 1991-1993, page 120
  #
  # NOTE: Position 5 is factory-unassigned ("nicht belegt").
  # Position 6 is on permanent 12V (terminal 30) and powers the trunk light,
  # central locking controller, automatic antenna, and IRCL — the single
  # biggest parasitic draw source in the car.
  # AOK912: Fuse 6 was found BLOWN on 2026-03-30 (original aluminum torpedo).
  # =============================================================================

  - id: F20_1
    rating_amps: 16
    color: "red"
    location: "Trunk fuse box F20, position 1"
    protects:
      - "Window lifter left (Fensterheber links)"
    terminal: "30"
    permanent_12v: false
    notes: "Motor only draws when operating. No sleep-state current."
    applies_to:
      years: [1989, 1995]
    source:
      type: "factory_manual"
      ref: "Betriebsanleitung 1991-1993, p.120"
      confidence: "high"

