description: >
  R129 fuse box assignments for pre-facelift models (1989-1995).
  The main fuse box is located in the engine compartment, left side.
  Additional fuses are in the trunk (rear SAM).
  NOTE: Specific fuse assignments need verification from the ETM.
  The owner's manual provides the fuse legend but circuit details require ETM data.

fuses:
  - id: F1
    rating_amps: 8
    location: "Main fuse box, engine compartment"
    protects:
      - "Instrument cluster"
      - "Diagnostic connector"
    applies_to:
      years: [1989, 1995]
    source:
      type: "owner_manual"
      ref: "1990 Owner's Manual, fuse chart"
      confidence: "medium"

