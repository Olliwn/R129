factory_notes:
  - note: "ADS is factory option 216 (not 211)"
    detail: >
      Option 216 = self-leveling suspension + ADS (full package including
      Niveauregulierung). The earlier mbdecoder.com lookup missed this code;
      lastvin.com shows it. All ADS hardware is original factory equipment.
      The non-ADS instrument cluster (missing ADS warning lamp) is therefore
      a confirmed swap by a previous owner.
  - note: "Option 538 — delivered without radio (common in European market)"
    detail: >
      Factory build says 'automatic antenna and front loudspeaker — without
      radio set'. Car was delivered with Hirschmann power antenna mechanism,
      front door speakers, and wiring harness — but no head unit and no
      amplifier. This was standard practice for European-market Mercedes
      (~90% of W124s were delivered the same way). No factory amplifier
      exists in the trunk. The Becker BE2210 currently installed drives
      speakers directly via its built-in amp. The Sony CDX-410 found at
      purchase was also aftermarket.

