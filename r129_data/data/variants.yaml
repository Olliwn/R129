production_changes:
  - year: 1989
    description: "R129 production begins. 300 SL (M103), 300 SL-24 (M104), 500 SL (M119.960)."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"

  - year: 1991
    description: "600 SL (M120 V12) added to lineup. ADS optional across range."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"

  - year: 1993
    description: "300 SL/SL-24 replaced by SL 280 and SL 320. 500 SL becomes 129.067 with M119.972 (HFM). Naming convention reversal (500 SL -> SL 500)."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"

  - year: 1995
    description: "Odometer switched from mechanical to electronic. Clear front turn signals (US). Bose stereo standard. Portable cell phone option."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"

  - year: 1996
    description: "Minor facelift: 2-slot fender vents (replacing 3-slot), body-color bumpers, side airbags. V8/V12 get 722.5 (5-speed electronic auto). Xenon HID standard on SL 600, optional on SL 500."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"

  - year: 1997
    description: "Panoramic roof added. Rain-sensing wipers standard. HomeLink garage door opener in rear-view mirror. Passenger occupant detection sensor."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"

  - year: 1999
    description: "Major refresh: M119 V8 replaced by M113 V8 (SL 500 becomes 129.068). 722.6 5-speed auto. Nappa leather. New steering wheel and taillights. 17-inch wheels standard. Fiber-optic audio. Tip-start ignition. Silver gauge rings."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"

  - year: 2001
    description: "Final production year. Replaced by R230 for 2002 model year."
    source:
      type: "wikipedia"
      ref: "Wikipedia R129 article"
      confidence: "high"
