# nRF5340 has two cores. sysbuild auto-builds the ipc_radio image for the
# network core when the app core enables Bluetooth. These hints make the
# HCI transport and the role (peripheral) explicit so the default BLE
# controller image is picked up.

SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
